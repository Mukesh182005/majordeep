# Production Docker Compose Override for DeepSentinel Beta
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d --build

services:
  # Caddy reverse proxy providing automatic TLS and 100MB body limit
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-beta.deepsentinel.ai}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend

  # Worker GPU (lab RTX 5070 machine): add -f docker-compose.gpu.yml after this
  # file. It builds the worker with the CUDA torch build and reserves the GPU;
  # reserving the GPU alone is not enough, the default image has CPU torch.

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
