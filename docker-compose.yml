# Local/production-style orchestration: frontend, API, inference worker,
# PostgreSQL and Redis.
#
#   cp .env.example .env      # then set JWT_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build
#
# Frontend: http://localhost:8080   API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepfake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deepfake}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepfake}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    # Apply migrations before serving. The schema is owned by Alembic in
    # production, never by create_all.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deepfake}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deepfake}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      STORAGE_DIR: /app/storage/uploads
      EVIDENCE_DIR: /app/storage/evidence
      REPORT_DIR: /app/storage/reports
      CHECKPOINT_DIR: /app/checkpoints
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Inside Docker the app never reads .env, so every limit is passed here;
      # without these it ran at the 500-uploads-per-hour code defaults.
      UPLOAD_RATE_LIMIT_PER_HOUR: ${UPLOAD_RATE_LIMIT_PER_HOUR:-20}
      GUEST_RATE_LIMIT_PER_HOUR: ${GUEST_RATE_LIMIT_PER_HOUR:-3}
      FACE_MODEL_IN_VERDICT: ${FACE_MODEL_IN_VERDICT:-false}
      RETENTION_HOURS: ${RETENTION_HOURS:-72}
      ENABLED_MEDIA_TYPES: ${ENABLED_MEDIA_TYPES:-image,audio,video}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-600}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-300}
      # Only the frontend nginx (fixed address below) may set X-Real-IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.28.0.10}
      # Audio verdict: the ASVspoof 2019 LA LCNN with its dev-fitted calibration
      # and the verdict rule frozen on dev (paper/config, mounted below). The
      # checkpoint itself comes from ./checkpoints (weights are not in git).
      AUDIO_MODEL_SOURCE: ${AUDIO_MODEL_SOURCE:-lcnn_asvspoof}
      AUDIO_LCNN_CALIBRATION_FILE: /app/paper_config/audio_calibration.json
      AUDIO_VERDICT_CONFIG_FILE: /app/paper_config/frozen_audio_config.json
      # pellav2 (2.3 GB, downloaded once into the worker's HF cache): scored on every
      # clip and decides the verdict unless AUDIO_PELLAV2_IN_VERDICT=false.
      AUDIO_PELLAV2_ENABLED: ${AUDIO_PELLAV2_ENABLED:-true}
      AUDIO_PELLAV2_IN_VERDICT: ${AUDIO_PELLAV2_IN_VERDICT:-true}
      AUDIO_PELLAV2_MAX_WINDOWS: ${AUDIO_PELLAV2_MAX_WINDOWS:-8}
      AUDIO_PELLAV2_CONFIG_FILE: /app/paper_config/pellav2_verdict_config.json
      # cuda falls back to CPU when no GPU is visible; docker-compose.gpu.yml
      # gives the worker the GPU and the CUDA torch build.
      DEVICE: ${DEVICE:-cpu}
      # Community Forensics scene detector: weight 0 = scored and shown, not in the verdict.
      COMMFOR_ENABLED: ${COMMFOR_ENABLED:-true}
      COMMFOR_WEIGHT: ${COMMFOR_WEIGHT:-4}
    volumes:
      # Shared with the worker: the API writes uploads, the worker reads them
      # and writes evidence back.
      - media:/app/storage
      - ./checkpoints:/app/checkpoints:ro
      - ./paper/config:/app/paper_config:ro
    ports:
      - "8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: >
      sh -c "python -c 'from app.ml.image_pipeline import get_scene_detector; get_scene_detector()' &&
             python -c 'from app.config import settings; from app.ml.audio.pellav2 import get_pellav2; settings.audio_pellav2_enabled and get_pellav2()' &&
             celery -A app.worker.celery_app.celery_app worker --loglevel=info --concurrency=1"
    environment:
      <<: *backend_env
      HF_HOME: /app/.cache/huggingface
    volumes:
      - media:/app/storage
      - ./checkpoints:/app/checkpoints:ro
      - ./paper/config:/app/paper_config:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Sends the hourly retention purge (guest jobs older than RETENTION_HOURS)
  # to the worker, which deletes the files and database rows.
  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat",
              "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *backend_env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      default:
        # Fixed so the API can trust X-Real-IP from this container alone
        # (TRUSTED_PROXIES above).
        ipv4_address: 172.28.0.10
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db_data:
  redis_data:
  media:
  hf_cache:
